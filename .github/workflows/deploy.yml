name: Deploy to EasyPanel (11 PM Ecuador)

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if deploy is needed
        run: |
          LATEST=$(git rev-parse HEAD)
          DEPLOYED=""
          if git tag -l "deployed" > /dev/null 2>&1; then
            DEPLOYED=$(git rev-parse deployed 2>/dev/null || echo "")
          fi

          if [ "$LATEST" = "$DEPLOYED" ]; then
            echo "No new changes since last deploy. Skipping."
            exit 0
          fi

      - name: Trigger EasyPanel Redeploy
        env:
          EASYPANEL_URL: ${{ secrets.EASYPANEL_URL }}
          EASYPANEL_TOKEN: ${{ secrets.EASYPANEL_REDEPLOY_CICD }}
        run: |
          echo "Triggering redeploy on EasyPanel..."

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer $EASYPANEL_TOKEN" \
            -H "Content-Type: application/json" \
            "$EASYPANEL_URL/api/rpc/service.deploy" \
            -d '{}')

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Redeploy triggered successfully!"
          else
            echo "Failed to trigger redeploy"
            exit 1
          fi

      - name: Mark as deployed
        if: success()
        run: |
          git tag -f deployed
          git push origin deployed --force
