name: Deploy to EasyPanel (11 PM Daily)

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger EasyPanel Redeploy
        env:
          EASYPANEL_URL: ${{ secrets.EASYPANEL_URL }}
          EASYPANEL_TOKEN: ${{ secrets.EASYPANEL_REDEPLOY_CICD }}
        run: |
          echo "Triggering redeploy on EasyPanel..."

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer $EASYPANEL_TOKEN" \
            -H "Content-Type: application/json" \
            "$EASYPANEL_URL/api/rpc/service.deploy" \
            -d '{}')

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Redeploy triggered successfully!"
          else
            echo "Failed to trigger redeploy"
            exit 1
          fi
