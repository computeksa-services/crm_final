<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    details > summary { list-style: none; }
    details > summary::-webkit-details-marker { display: none; }
    input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }
  </style>
</head>
<body class="bg-[#F5F5F7] text-zinc-900 min-h-screen pb-20">

  <!-- ========================================== -->
  <!-- HEADER STICKY (Estilo Apple Glassmorphism) -->
  <!-- ========================================== -->
  <header class="bg-white/80 backdrop-blur-md border-b border-zinc-200 sticky top-0 z-40">
    <div class="max-w-[1000px] mx-auto px-4 sm:px-6 h-14 flex items-center justify-between">
      <div>
        <h1 class="text-[15px] font-semibold tracking-tight text-zinc-900">Nuevo Trato</h1>
      </div>
      <div class="flex items-center gap-2 sm:gap-3">
        <button class="h-8 px-3 sm:px-4 bg-transparent text-zinc-600 rounded-md text-[12px] font-medium hover:bg-zinc-100 transition-colors">
          Cancelar
        </button>
        <button class="h-8 px-4 sm:px-5 bg-blue-600 text-white rounded-md text-[12px] font-medium hover:bg-blue-700 transition-colors shadow-sm flex items-center gap-2">
          Guardar Trato
        </button>
      </div>
    </div>
  </header>

  <!-- ========================================== -->
  <!-- CONTENEDOR UNIFICADO DEL FORMULARIO        -->
  <!-- ========================================== -->
  <main class="max-w-[1000px] mx-auto px-4 sm:px-6 mt-6 sm:mt-8">
    
    <!-- Bloque Principal -->
    <div class="bg-white border border-zinc-200 rounded-xl shadow-sm flex flex-col md:flex-row items-stretch overflow-hidden">
      
      <!-- === LADO IZQUIERDO: DATOS PRINCIPALES (65%) === -->
      <div class="w-full md:w-[65%] p-5 sm:p-8 border-b md:border-b-0 md:border-r border-zinc-200">
        
        <!-- SECCIÓN 1: INFO DEL TRATO -->
        <h3 class="text-[11px] font-bold text-zinc-400 uppercase tracking-wider mb-4 flex items-center gap-2">
          <i class="fa-solid fa-layer-group"></i> Información
        </h3>
        
        <div class="space-y-5 mb-8">
          <!-- Fila 1: Nombre (100%) -->
          <div>
            <label class="block text-[12px] font-medium text-zinc-700 mb-1.5">Nombre de la Oportunidad <span class="text-red-500">*</span></label>
            <input type="text" value="Venta de Servidores Cloud" class="w-full text-[13px] text-zinc-900 bg-white border border-zinc-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 rounded-lg px-3 py-2 outline-none transition-all shadow-sm placeholder:text-zinc-400" placeholder="Ej. Implementación CRM">
          </div>

          <!-- Fila 2: Valor Estimado y Fecha de Cierre (50/50) -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
            <!-- Valor Estimado -->
            <div>
              <label class="block text-[12px] font-medium text-zinc-700 mb-1.5">Valor Estimado</label>
              <div class="relative flex items-center">
                <span class="absolute left-3 text-[13px] font-semibold text-zinc-400">$</span>
                <input type="text" value="12,500.00" class="w-full pl-7 pr-3 py-2 text-[13px] font-mono font-medium text-zinc-900 bg-white border border-zinc-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 rounded-lg outline-none transition-all shadow-sm placeholder:text-zinc-400" placeholder="0.00">
              </div>
            </div>
            <!-- Fecha Estimada de Cierre -->
            <div>
              <label class="block text-[12px] font-medium text-zinc-700 mb-1.5">Cierre Estimado</label>
              <input type="date" class="w-full px-3 py-2 text-[13px] font-medium text-zinc-900 bg-white border border-zinc-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 rounded-lg outline-none transition-all shadow-sm cursor-pointer">
            </div>
          </div>

          <!-- Fila 3: Descripción -->
          <div>
            <label class="block text-[12px] font-medium text-zinc-700 mb-1.5">Descripción o Notas</label>
            <textarea rows="3" class="w-full text-[13px] text-zinc-900 bg-white border border-zinc-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 rounded-lg px-3 py-2 outline-none transition-all shadow-sm resize-none placeholder:text-zinc-400" placeholder="Añade contexto adicional, notas o detalles clave..."></textarea>
          </div>
        </div>

        <!-- SECCIÓN 2: CLIENTE Y CONTACTO -->
        <h3 class="text-[11px] font-bold text-zinc-400 uppercase tracking-wider mb-4 flex items-center gap-2 border-t border-zinc-100 pt-6">
          <i class="fa-regular fa-building"></i> Cliente
        </h3>
        
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
          <!-- Empresa -->
          <div>
            <div class="flex justify-between items-center mb-1.5">
              <label class="block text-[12px] font-medium text-zinc-700">Empresa <span class="text-red-500">*</span></label>
              <!-- Botón Estilo Apple (Píldora) -->
              <button class="text-[10px] font-semibold text-zinc-600 bg-zinc-100 hover:bg-zinc-200 px-2.5 py-0.5 rounded-full transition-colors flex items-center gap-1 border border-zinc-200/50">
                <i class="fa-solid fa-plus text-[8px]"></i> Nueva
              </button>
            </div>
            <details class="relative group" tabindex="0">
              <summary class="w-full text-[13px] text-zinc-900 bg-white border border-zinc-300 rounded-lg px-3 py-2 outline-none cursor-pointer flex items-center justify-between shadow-sm focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20">
                <span class="truncate">SIEMENS HEALTHCARE</span>
                <i class="fa-solid fa-chevron-down text-[10px] text-zinc-400"></i>
              </summary>
              <div class="absolute top-full left-0 right-0 mt-1 bg-white border border-zinc-200 rounded-lg shadow-xl z-50 py-1 overflow-hidden">
                <label class="block px-3 py-2 text-[13px] font-medium text-blue-700 bg-blue-50 border-l-2 border-blue-500 cursor-pointer">SIEMENS HEALTHCARE</label>
                <label class="block px-3 py-2 text-[13px] text-zinc-700 hover:bg-zinc-50 cursor-pointer">Computeksa S.A.</label>
              </div>
            </details>
          </div>

          <!-- Contacto -->
          <div>
            <div class="flex justify-between items-center mb-1.5">
              <label class="block text-[12px] font-medium text-zinc-700">Contacto principal <span class="text-red-500">*</span></label>
              <!-- Botón Estilo Apple (Píldora) -->
              <button class="text-[10px] font-semibold text-zinc-600 bg-zinc-100 hover:bg-zinc-200 px-2.5 py-0.5 rounded-full transition-colors flex items-center gap-1 border border-zinc-200/50">
                <i class="fa-solid fa-plus text-[8px]"></i> Nuevo
              </button>
            </div>
            <details class="relative group" tabindex="0">
              <summary class="w-full text-[13px] text-zinc-900 bg-white border border-zinc-300 rounded-lg px-3 py-2 outline-none cursor-pointer flex items-center justify-between shadow-sm focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20">
                <span class="truncate">Silvia Buenaventura</span>
                <i class="fa-solid fa-chevron-down text-[10px] text-zinc-400"></i>
              </summary>
              <div class="absolute top-full left-0 right-0 mt-1 bg-white border border-zinc-200 rounded-lg shadow-xl z-50 py-1">
                <label class="block px-3 py-2 text-[13px] font-medium text-blue-700 bg-blue-50 border-l-2 border-blue-500 cursor-pointer">Silvia Buenaventura</label>
              </div>
            </details>
          </div>
        </div>

      </div>

      <!-- === LADO DERECHO: METADATOS Y CLASIFICACIÓN (35%) === -->
      <div class="w-full md:w-[35%] p-5 sm:p-8 bg-zinc-50/50 flex flex-col">
        
        <h3 class="text-[11px] font-bold text-zinc-400 uppercase tracking-wider mb-4">
          Clasificación
        </h3>
        
        <div class="space-y-4 flex-1">
          <!-- Estado -->
          <div>
            <label class="block text-[12px] font-medium text-zinc-700 mb-1.5">Estado del Pipeline <span class="text-red-500">*</span></label>
            <details class="relative group" tabindex="0">
              <summary class="w-full bg-white border border-zinc-300 rounded-lg px-3 py-2 cursor-pointer flex items-center justify-between shadow-sm hover:border-zinc-400 transition-colors outline-none">
                <span class="flex items-center gap-2 text-[13px] font-medium text-zinc-900">
                  <span class="w-2 h-2 rounded-full bg-blue-500 shadow-[0_0_8px_rgba(59,130,246,0.5)]"></span> En Negociación
                </span>
                <i class="fa-solid fa-chevron-down text-[10px] text-zinc-400"></i>
              </summary>
              <div class="absolute top-full left-0 right-0 mt-1 bg-white border border-zinc-200 rounded-lg shadow-xl z-50 py-1">
                <label class="flex items-center gap-2 px-3 py-2 text-[13px] text-zinc-700 hover:bg-zinc-50 cursor-pointer">
                  <span class="w-2 h-2 rounded-full bg-zinc-400"></span> Prospecto
                </label>
                <label class="flex items-center gap-2 px-3 py-2 text-[13px] font-medium text-blue-700 bg-blue-50 cursor-pointer">
                  <span class="w-2 h-2 rounded-full bg-blue-500"></span> En Negociación <i class="fa-solid fa-check ml-auto text-blue-600"></i>
                </label>
              </div>
            </details>
          </div>

          <!-- Nivel de Interés -->
          <div>
            <label class="block text-[12px] font-medium text-zinc-700 mb-1.5">Nivel de Interés <span class="text-red-500">*</span></label>
            <details class="relative group" tabindex="0">
              <summary class="w-full bg-white border border-zinc-300 rounded-lg px-3 py-2 cursor-pointer flex items-center justify-between shadow-sm hover:border-zinc-400 transition-colors outline-none">
                <span class="px-2 py-0.5 rounded text-[11px] font-bold uppercase tracking-wide bg-amber-100 text-amber-700 flex items-center gap-1.5 w-fit border border-amber-200/50">
                  <i class="fa-solid fa-fire text-[9px]"></i> Alto
                </span>
                <i class="fa-solid fa-chevron-down text-[10px] text-zinc-400"></i>
              </summary>
              <div class="absolute top-full left-0 right-0 mt-1 bg-white border border-zinc-200 rounded-lg shadow-xl z-50 py-1">
                <label class="flex items-center px-3 py-2 text-[13px] text-zinc-700 hover:bg-zinc-50 cursor-pointer">Alto</label>
                <label class="flex items-center px-3 py-2 text-[13px] text-zinc-700 hover:bg-zinc-50 cursor-pointer">Medio</label>
              </div>
            </details>
          </div>

          <!-- Canal de Origen -->
          <div>
            <label class="block text-[12px] font-medium text-zinc-700 mb-1.5">Canal de Origen <span class="text-red-500">*</span></label>
            <details class="relative group" tabindex="0">
              <summary class="w-full bg-white border border-zinc-300 rounded-lg px-3 py-2 cursor-pointer flex items-center justify-between shadow-sm hover:border-zinc-400 transition-colors outline-none">
                <span class="text-[13px] font-medium text-zinc-900 flex items-center gap-2">
                  <i class="fa-brands fa-whatsapp text-[#25D366] text-[15px]"></i> WhatsApp
                </span>
                <i class="fa-solid fa-chevron-down text-[10px] text-zinc-400"></i>
              </summary>
              <div class="absolute top-full left-0 right-0 mt-1 bg-white border border-zinc-200 rounded-lg shadow-xl z-50 py-1">
                <label class="flex items-center gap-2 px-3 py-2 text-[13px] text-zinc-700 hover:bg-zinc-50 cursor-pointer">
                  <i class="fa-solid fa-globe text-zinc-400 text-[14px]"></i> Formulario Web
                </label>
              </div>
            </details>
          </div>
        </div>

        <!-- EQUIPO ASIGNADO (Asignación Directa) -->
        <div class="mt-8 border-t border-zinc-200 pt-6">
          <h3 class="text-[11px] font-bold text-zinc-400 uppercase tracking-wider mb-3">
            Equipo Asignado
          </h3>
          
          <div class="space-y-2">
            <!-- Propietario (Tú) -->
            <div class="flex items-center justify-between p-2 rounded-lg bg-white border border-zinc-200 shadow-sm">
              <div class="flex items-center gap-2.5">
                <img src="https://i.pravatar.cc/100?img=33" class="w-7 h-7 rounded-full border border-zinc-200">
                <div class="leading-tight">
                  <p class="text-[12px] font-semibold text-zinc-900">Leonel Sabando <span class="text-zinc-400 font-normal">(Tú)</span></p>
                  <p class="text-[10px] font-medium text-zinc-500">Propietario</p>
                </div>
              </div>
            </div>
            
            <!-- Selector para agregar más colaboradores -->
            <details class="relative" tabindex="0">
              <summary class="w-full flex items-center gap-2.5 p-2 rounded-lg border border-dashed border-zinc-300 text-zinc-500 hover:bg-zinc-100 hover:text-zinc-800 transition-colors cursor-pointer outline-none">
                <div class="w-7 h-7 rounded-full bg-zinc-100 flex items-center justify-center shrink-0">
                  <i class="fa-solid fa-plus text-[11px]"></i>
                </div>
                <span class="text-[12px] font-medium">Asignar colaborador...</span>
              </summary>
              
              <!-- Dropdown de usuarios -->
              <div class="absolute bottom-full mb-1 left-0 right-0 bg-white border border-zinc-200 rounded-lg shadow-xl z-50 p-1">
                <input type="text" placeholder="Buscar usuario..." class="w-full px-3 py-2 text-[12px] bg-transparent border-b border-zinc-100 outline-none mb-1 text-zinc-900 placeholder:text-zinc-400">
                <label class="flex items-center gap-2.5 px-2 py-1.5 hover:bg-zinc-50 rounded-md cursor-pointer">
                  <img src="https://i.pravatar.cc/100?img=47" class="w-6 h-6 rounded-full border border-zinc-200">
                  <span class="text-[13px] text-zinc-800 font-medium">Ana Gómez</span>
                </label>
                <label class="flex items-center gap-2.5 px-2 py-1.5 hover:bg-zinc-50 rounded-md cursor-pointer">
                  <img src="https://i.pravatar.cc/100?img=11" class="w-6 h-6 rounded-full border border-zinc-200">
                  <span class="text-[13px] text-zinc-800 font-medium">Carlos Ruiz</span>
                </label>
              </div>
            </details>
          </div>

        </div>

      </div>

    </div>
  </main>

</body>
</html>
