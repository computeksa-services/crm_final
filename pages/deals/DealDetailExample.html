<!-- Fuentes e Iconos -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  body { font-family: 'Inter', sans-serif; }
  body { background-color: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0;}
  textarea:focus { outline: none; box-shadow: none; }
</style>

<!-- CONTENEDOR DEL MODAL -->
<div class="bg-white w-[520px] rounded-xl shadow-2xl overflow-hidden font-sans border border-zinc-200/60 flex flex-col max-h-[90vh]">
  
  <!-- HEADER -->
  <div class="px-5 py-4 flex items-start justify-between shrink-0">
    <div>
      <h2 class="text-[15px] font-bold text-zinc-900 tracking-tight">Nueva Interacción</h2>
      <p class="text-[12px] text-zinc-500 font-medium mt-0.5 flex items-center gap-1.5">
        <i class="fa-regular fa-user text-zinc-400"></i> Pablo Luna (SVETLANROSS)
      </p>
    </div>
    <button class="text-zinc-400 hover:text-zinc-700 transition-colors w-7 h-7 flex items-center justify-center rounded-md hover:bg-zinc-100">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>

  <!-- CUERPO SCROLLABLE -->
  <div class="px-5 pb-2 overflow-y-auto custom-scrollbar">
    
    <!-- 1. CAJA DE HERRAMIENTAS -->
    <div class="border border-zinc-200 rounded-lg overflow-hidden focus-within:border-zinc-400 focus-within:ring-1 focus-within:ring-zinc-400 transition-all bg-white shadow-sm">
      <div class="flex items-center gap-1 border-b border-zinc-100 bg-zinc-50/50 p-1.5 overflow-x-auto scrollbar-hide">
        <button class="px-2.5 py-1 rounded bg-white border border-zinc-200 text-zinc-900 text-[11px] font-bold shadow-sm flex items-center gap-1.5 shrink-0">
          <i class="fa-solid fa-align-left text-zinc-400"></i> Nota
        </button>
        <button class="px-2.5 py-1 rounded text-zinc-500 text-[11px] font-medium hover:bg-zinc-200/50 hover:text-zinc-900 transition-colors flex items-center gap-1.5 shrink-0">
          <i class="fa-solid fa-phone text-zinc-400"></i> Llamada
        </button>
        <button class="px-2.5 py-1 rounded text-zinc-500 text-[11px] font-medium hover:bg-zinc-200/50 hover:text-zinc-900 transition-colors flex items-center gap-1.5 shrink-0">
          <i class="fa-brands fa-whatsapp text-emerald-500"></i> WhatsApp
        </button>
      </div>
      <textarea placeholder="Escribe los detalles de la gestión aquí..." class="w-full text-[13px] text-zinc-800 placeholder:text-zinc-400 bg-transparent border-0 resize-none h-24 p-3"></textarea>
    </div>

    <!-- 2. PROGRAMACIÓN DE ACCIÓN -->
    <div class="mt-6">
      
      <div class="flex items-center justify-between mb-4">
        <div>
          <h3 class="text-[13px] font-semibold text-zinc-900">Programar siguiente paso</h3>
          <p class="text-[11px] text-zinc-500 mt-0.5">Define una fecha para hacer seguimiento.</p>
        </div>
        <label class="relative inline-flex items-center cursor-pointer">
          <input type="checkbox" value="" class="sr-only peer" checked>
          <div class="w-9 h-5 bg-zinc-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-zinc-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-zinc-900"></div>
        </label>
      </div>

      <!-- Cuadrícula Principal de Programación -->
      <div class="p-3 bg-zinc-50 border border-zinc-200/80 rounded-lg">
        
        <div class="grid grid-cols-2 gap-3 mb-3">
          <div>
            <label class="block text-[10px] font-bold text-zinc-500 uppercase tracking-wide mb-1">Fecha límite</label>
            <input type="date" value="2026-03-09" class="w-full px-2.5 py-1.5 text-[12px] text-zinc-800 border border-zinc-200 rounded text-sm focus:border-zinc-400 focus:ring-0 bg-white shadow-sm" />
          </div>
          <div>
            <label class="block text-[10px] font-bold text-zinc-500 uppercase tracking-wide mb-1">¿Qué harás?</label>
            <input type="text" placeholder="Ej: Llamada..." class="w-full px-2.5 py-1.5 text-[12px] text-zinc-800 border border-zinc-200 rounded focus:border-zinc-400 focus:ring-0 bg-white shadow-sm placeholder:text-zinc-300" />
          </div>
        </div>

        <!-- Botón Activo de Google Calendar (Simula que se hizo clic) -->
        <div class="pt-3 border-t border-zinc-200/60">
          <button class="flex items-center justify-between w-full text-left group">
            <span class="flex items-center gap-1.5 text-[11px] font-bold text-blue-600">
              <i class="fa-brands fa-google text-blue-500"></i> Evento de Calendario Activado
            </span>
            <i class="fa-solid fa-chevron-up text-[10px] text-zinc-400"></i>
          </button>

          <!-- ============================================== -->
          <!-- SECCIÓN DESPLEGABLE: Detalles del Calendario   -->
          <!-- ============================================== -->
          <div class="mt-3 pt-3 border-t border-zinc-200/60 space-y-4 animate-fade-in">
            
            <!-- Fila Horarios -->
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-[10px] font-bold text-zinc-500 uppercase tracking-wide mb-1">Hora Inicio</label>
                <input type="time" value="10:00" class="w-full px-2.5 py-1.5 text-[12px] text-zinc-800 border border-zinc-200 rounded focus:border-zinc-400 focus:ring-0 bg-white shadow-sm" />
              </div>
              <div>
                <label class="block text-[10px] font-bold text-zinc-500 uppercase tracking-wide mb-1">Hora Fin</label>
                <input type="time" value="11:00" class="w-full px-2.5 py-1.5 text-[12px] text-zinc-800 border border-zinc-200 rounded focus:border-zinc-400 focus:ring-0 bg-white shadow-sm" />
              </div>
            </div>

            <!-- Ubicación -->
            <div>
              <label class="block text-[10px] font-bold text-zinc-500 uppercase tracking-wide mb-1">Ubicación o Enlace</label>
              <div class="relative">
                <i class="fa-solid fa-location-dot absolute left-2.5 top-2 text-zinc-300 text-[11px]"></i>
                <input type="text" placeholder="Ej: Google Meet, Sala 1..." class="w-full pl-7 pr-2.5 py-1.5 text-[12px] text-zinc-800 border border-zinc-200 rounded focus:border-zinc-400 focus:ring-0 bg-white shadow-sm placeholder:text-zinc-300" />
              </div>
            </div>

            <!-- Invitados (Input + Chips) -->
            <div>
              <label class="block text-[10px] font-bold text-zinc-500 uppercase tracking-wide mb-1">Invitados (Se enviará correo)</label>
              <div class="relative mb-2">
                <i class="fa-solid fa-user-plus absolute left-2.5 top-2 text-zinc-300 text-[11px]"></i>
                <input type="text" placeholder="Buscar compañero o ingresar email..." class="w-full pl-7 pr-2.5 py-1.5 text-[12px] text-zinc-800 border border-zinc-200 rounded focus:border-zinc-400 focus:ring-0 bg-white shadow-sm placeholder:text-zinc-300" />
              </div>
              
              <!-- Chips de invitados seleccionados -->
              <div class="flex flex-wrap gap-1.5">
                <!-- Contacto Principal (Bloqueado/Fijo) -->
                <span class="inline-flex items-center gap-1.5 pl-1.5 pr-2 py-1 bg-white border border-zinc-200 rounded-md text-[10px] font-semibold text-zinc-700 shadow-sm">
                  <div class="w-4 h-4 rounded bg-zinc-100 flex items-center justify-center text-zinc-500"><i class="fa-solid fa-user text-[8px]"></i></div>
                  Cliente
                </span>
                <!-- Compañero Interno -->
                <span class="inline-flex items-center gap-1.5 pl-1.5 pr-1 py-1 bg-white border border-zinc-200 rounded-md text-[10px] font-semibold text-zinc-700 shadow-sm group">
                  <img src="https://lh3.googleusercontent.com/a/ACg8ocIwov-7RUzzjv7ytzz1-e8-0x7EYRKOYG2eql-q4o7qabjVkg=s96-c" class="w-4 h-4 rounded object-cover" />
                  Leonel S.
                  <button class="w-3.5 h-3.5 rounded-sm hover:bg-zinc-200 flex items-center justify-center text-zinc-400 hover:text-red-500 transition-colors"><i class="fa-solid fa-xmark"></i></button>
                </span>
                <!-- Invitado Externo -->
                <span class="inline-flex items-center gap-1.5 px-2 py-1 bg-white border border-zinc-200 rounded-md text-[10px] font-medium text-zinc-600 shadow-sm group">
                  jefe@empresa.com
                  <button class="w-3.5 h-3.5 rounded-sm hover:bg-zinc-200 flex items-center justify-center text-zinc-400 hover:text-red-500 transition-colors"><i class="fa-solid fa-xmark"></i></button>
                </span>
              </div>
            </div>

          </div>
          <!-- FIN SECCIÓN DESPLEGABLE -->

        </div>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <div class="px-5 py-4 flex items-center justify-end gap-3 mt-2 border-t border-zinc-100 shrink-0 bg-white">
    <button class="text-[12px] font-bold text-zinc-500 hover:text-zinc-900 transition-colors">Cancelar</button>
    <button class="px-4 py-2 text-[12px] font-bold bg-zinc-900 text-white rounded-lg shadow-sm hover:bg-zinc-800 transition-colors flex items-center gap-1.5">
      Registrar y Agendar
    </button>
  </div>

</div>
